services:
  # ---------------------------------------------------------------------------
  # 1. Laravel 11 Application Container
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-hp-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - credit-hp-network
    depends_on:
      - db
      - evolution-redis

  # ---------------------------------------------------------------------------
  # 2. Nginx Web Server for Laravel
  # ---------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: credit-hp-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - credit-hp-network
    depends_on:
      - app

  # ---------------------------------------------------------------------------
  # 3. MySQL Database Container
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: credit-hp-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: credit_hp
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_PASSWORD: secretpassword
      MYSQL_USER: credit_hp_user
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - credit-hp-network

  # ---------------------------------------------------------------------------
  # 4. Redis Container for Evolution API
  # ---------------------------------------------------------------------------
  evolution-redis:
    image: redis:alpine
    container_name: credit-hp-evolution-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - credit-hp-network

  # ---------------------------------------------------------------------------
  # 5. Evolution API Container (WhatsApp Gateway)
  # Repo: https://github.com/evolution-foundation/evolution-api
  # Image: evolutionapi/evolution-api:v2.1.1
  # ---------------------------------------------------------------------------
  evolution-api:
    image: evolutionapi/evolution-api:v2.1.1
    container_name: credit-hp-evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV_CI=true
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=429683C4C977415CAAFCCE10F7D57E11
      - DATABASE_ENABLED=false
      - DATABASE_PROVIDER=local
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG
      - LOG_COLOR=true
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - credit-hp-network
    depends_on:
      - evolution-redis

networks:
  credit-hp-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
  evolution_instances:
    driver: local
