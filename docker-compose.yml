services:
  # ---------------------------------------------------------------------------
  # 1. Laravel 12 / PHP 8.3 Application Container
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-hp-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      EVOLUTION_API_URL: http://evolution-api:8080
    networks:
      - credit-hp-network
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 2. Nginx Web Server for Laravel
  # ---------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: credit-hp-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - credit-hp-network
    depends_on:
      - app

  # ---------------------------------------------------------------------------
  # 3. MySQL Database Container
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: credit-hp-db
    restart: unless-stopped
    tty: true
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-credit_hp}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_USER: ${DB_USERNAME:-credit_hp_user}
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - credit-hp-network

  # ---------------------------------------------------------------------------
  # 4. Redis Container for Evolution API
  # ---------------------------------------------------------------------------
  evolution-redis:
    image: redis:alpine
    container_name: credit-hp-evolution-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - credit-hp-network

  # ---------------------------------------------------------------------------
  # 5. Evolution API Container (WhatsApp Gateway)
  # Repo: https://github.com/evolution-foundation/evolution-api
  # Image: evolutionapi/evolution-api:v2.1.1
  # ---------------------------------------------------------------------------
  evolution-api:
    profiles: [whatsapp]
    image: evolutionapi/evolution-api:v2.1.1
    container_name: credit-hp-evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV_CI=true
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-}
      - DATABASE_ENABLED=false
      - DATABASE_PROVIDER=local
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG
      - LOG_COLOR=true
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - credit-hp-network
    depends_on:
      - evolution-redis

networks:
  credit-hp-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
  evolution_instances:
    driver: local
